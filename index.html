<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dar-e-Arqam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="hero" aria-label="Dar-e-Arqam hero">
    <video
      id="hero-video"
      class="hero__video"
      src="video/banner.mp4"
      autoplay
      muted
      playsinline
      aria-hidden="true"
    ></video>

    <div class="hero__overlay" aria-hidden="true"></div>

    <div class="hero__content">
      <div class="hero__stack">
        <div class="hero__crop hero__crop--logo">
          <img src="images/logo.svg" alt="Dar-e-Arqam" />
        </div>
        <div class="hero__crop hero__crop--line1">
          <img src="images/nurturing_minds.svg" alt="Nurturing Minds" />
        </div>
        <div class="hero__crop hero__crop--line2">
          <img src="images/building_futures.svg" alt="Building Futures" />
        </div>
      </div>
    </div>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
